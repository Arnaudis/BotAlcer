services:

  ollama:
    image: ollama/ollama:0.X.Y   # pon tu versión actual
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_QUEUE=10
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_FLASH_ATTENTION=1
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8501:8501"
    user: "1001:1001"
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./conversaciones:/app/conversaciones
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ollama_data: